services:
  payload:
    image: node:18-alpine
    container_name: budget-payload
    restart: unless-stopped
    working_dir: /home/node/app/
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      # --- nginx-proxy / letsencrypt wiring ---
      - VIRTUAL_HOST=${HOST}            # e.g. budget.samuelhilson.com
      - VIRTUAL_PATH=/                  # serve Payload at root
      - VIRTUAL_NETWORK=${PROXY_HOST}   # e.g. home-server_proxy-tier
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${HOST}
      - LETSENCRYPT_EMAIL=${LE_EMAIL}
      - SERVER_URL=https://${HOST}
      # Tell Next.js it's behind a proxy
      - HOSTNAME=0.0.0.0
    networks:
      - proxy-net

  # Ensure your DATABASE_URI uses 'mongo' as the hostname ie. mongodb://mongo/my-db-name
  mongo:
    image: mongo:latest
    container_name: budget-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none
    networks:
      - proxy-net

volumes:
  data:
  node_modules:

networks:
  proxy-net:
    name: home-server_proxy-tier
    external: true
